<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <!-- T-Shirt Fabric Gradient (lighting) -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0ede8" />
      <stop offset="30%" stop-color="#faf8f4" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#faf8f4" />
      <stop offset="100%" stop-color="#e8e5df" />
    </linearGradient>

    <!-- Fabric Shadow (3D depth) -->
    <linearGradient id="shirtShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)" />
      <stop offset="85%" stop-color="rgba(0,0,0,0)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.08)" />
    </linearGradient>

    <!-- Sleeve Shadow -->
    <linearGradient id="sleeveShadowL" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.06)" />
      <stop offset="50%" stop-color="rgba(0,0,0,0)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.04)" />
    </linearGradient>

    <linearGradient id="sleeveShadowR" x1="100%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.06)" />
      <stop offset="50%" stop-color="rgba(0,0,0,0)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.04)" />
    </linearGradient>

    <!-- HCCS Red Gradient for design -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d93a1e" />
      <stop offset="50%" stop-color="#bf311a" />
      <stop offset="100%" stop-color="#9e2816" />
    </linearGradient>

    <!-- Yellow accent -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4dc00" />
      <stop offset="50%" stop-color="#fce83a" />
      <stop offset="100%" stop-color="#d4b84a" />
    </linearGradient>

    <!-- Red to Yellow gradient -->
    <linearGradient id="redYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf311a" />
      <stop offset="70%" stop-color="#f4dc00" />
    </linearGradient>

    <!-- Ground Shadow -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.2)" />
      <stop offset="60%" stop-color="rgba(0,0,0,0.04)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>

    <!-- Collar ribbing pattern -->
    <pattern id="ribPattern" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" opacity="0.08">
      <line x1="0" y1="0" x2="6" y2="0" stroke="#444" stroke-width="1" />
    </pattern>
  </defs>

  <!-- ========================================== -->
  <!-- GROUND SHADOW                               -->
  <!-- ========================================== -->
  <ellipse cx="300" cy="665" rx="230" ry="35" fill="url(#shadow)" />

  <!-- ========================================== -->
  <!-- T-SHIRT GARMENT SHAPE                      -->
  <!-- ========================================== -->

  <!-- Main t-shirt body (with neck cutout) -->
  <path d="
    M 300 72
    C 265 72, 242 78, 200 85
    C 158 92, 110 102, 75 122
    C 45 140, 30 180, 35 215
    C 38 240, 50 255, 70 255
    C 85 255, 98 242, 108 225
    L 138 208
    L 125 525
    C 122 560, 125 590, 135 610
    C 142 622, 155 628, 175 628
    L 425 628
    C 445 628, 458 622, 465 610
    C 475 590, 478 560, 475 525
    L 462 208
    L 492 225
    C 502 242, 515 255, 530 255
    C 550 255, 562 240, 565 215
    C 570 180, 555 140, 525 122
    C 490 102, 442 92, 400 85
    C 358 78, 335 72, 300 72

    M 262 90
    C 275 80, 290 76, 300 76
    C 310 76, 325 80, 338 90
    C 332 102, 318 106, 300 106
    C 282 106, 268 102, 262 90
  " fill-rule="evenodd" fill="url(#shirtGrad)" />

  <!-- Collar ribbing band -->
  <path d="
    M 262 90
    C 275 80, 290 76, 300 76
    C 310 76, 325 80, 338 90
    C 332 102, 318 106, 300 106
    C 282 106, 268 102, 262 90
  " fill="none" stroke="#ddd" stroke-width="6" opacity="0.6" />

  <!-- Collar fold shadow -->
  <path d="
    M 264 92
    C 276 83, 290 79, 300 79
    C 310 79, 324 83, 336 92
  " fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2" />

  <!-- ========================================== -->
  <!-- FABRIC FOLDS AND CREASES                   -->
  <!-- ========================================== -->

  <!-- Center vertical fold (subtle) -->
  <path d="M 300 110 Q 298 350 302 620" fill="none" stroke="rgba(0,0,0,0.03)" stroke-width="3" />

  <!-- Left chest fold -->
  <path d="M 175 180 Q 180 350 172 550" fill="none" stroke="rgba(0,0,0,0.03)" stroke-width="2" />

  <!-- Right chest fold -->
  <path d="M 425 180 Q 420 350 428 550" fill="none" stroke="rgba(0,0,0,0.03)" stroke-width="2" />

  <!-- Underarm fabric pull lines -->
  <path d="M 145 230 Q 155 260 152 300" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1.5" />
  <path d="M 455 230 Q 445 260 448 300" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1.5" />

  <!-- ========================================== -->
  <!-- SLEEVE HEM LINES                           -->
  <!-- ========================================== -->
  <!-- Left sleeve hem -->
  <path d="M 35 215 Q 45 218 38 240" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1.5" />
  <!-- Right sleeve hem -->
  <path d="M 565 215 Q 555 218 562 240" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1.5" />

  <!-- Bottom hem -->
  <path d="M 135 610 Q 300 622 465 610" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="2" />

  <!-- Bottom hem shadow -->
  <path d="M 140 618 Q 300 630 460 618" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1.5" />

  <!-- ========================================== -->
  <!-- CHEST DESIGN - MODERN SEAL + TEXT          -->
  <!-- ========================================== -->
  <g transform="translate(300, 305)">

    <!-- Background subtle circle -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="rgba(191,49,26,0.06)" stroke-width="40" />

    <!-- === SEAL / STAMP ELEMENT === -->
    <g transform="translate(0, -8)">
      <!-- Outer red ring -->
      <circle cx="0" cy="0" r="55" fill="none" stroke="url(#redGrad)" stroke-width="3" />

      <!-- Yellow inner ring -->
      <circle cx="0" cy="0" r="46" fill="none" stroke="url(#yellowGrad)" stroke-width="1.5" opacity="0.7" />

      <!-- Red center circle -->
      <circle cx="0" cy="0" r="40" fill="url(#redGrad)" opacity="0.08" />

      <!-- Character in center of seal -->
      <text x="0" y="4" text-anchor="middle" dominant-baseline="central"
            font-family="'STKaiti', 'KaiTi', 'SimSun', serif" font-size="32"
            fill="url(#redGrad)" font-weight="bold">希</text>

      <!-- Decorative lines above character -->
      <line x1="-18" y1="-32" x2="18" y2="-32" stroke="url(#redGrad)" stroke-width="1.5" opacity="0.4" />
      <line x1="-12" y1="-28" x2="12" y2="-28" stroke="url(#redGrad)" stroke-width="1" opacity="0.3" />

      <!-- Decorative lines below character -->
      <line x1="-18" y1="36" x2="18" y2="36" stroke="url(#redGrad)" stroke-width="1.5" opacity="0.4" />
      <line x1="-12" y1="32" x2="12" y2="32" stroke="url(#redGrad)" stroke-width="1" opacity="0.3" />

      <!-- Small corner marks on seal -->
      <rect x="-50" y="-50" width="8" height="3" fill="url(#yellowGrad)" rx="1" opacity="0.6" />
      <rect x="42" y="-50" width="8" height="3" fill="url(#yellowGrad)" rx="1" opacity="0.6" />
      <rect x="-50" y="47" width="8" height="3" fill="url(#yellowGrad)" rx="1" opacity="0.6" />
      <rect x="42" y="47" width="8" height="3" fill="url(#yellowGrad)" rx="1" opacity="0.6" />
    </g>

    <!-- === TEXT ELEMENTS === -->

    <!-- "HOPE" in large red text -->
    <text x="0" y="72" text-anchor="middle"
          font-family="'Raleway', Arial, Helvetica, sans-serif" font-size="24"
          fill="url(#redGrad)" font-weight="800" letter-spacing="8">HOPE</text>

    <!-- "CHINESE CHARTER SCHOOL" -->
    <text x="0" y="96" text-anchor="middle"
          font-family="'Raleway', Arial, Helvetica, sans-serif" font-size="10"
          fill="#1B365D" font-weight="600" letter-spacing="4">CHINESE CHARTER SCHOOL</text>

    <!-- Yellow divider line -->
    <line x1="-60" y1="108" x2="60" y2="108" stroke="url(#yellowGrad)" stroke-width="1.5" opacity="0.7" />

    <!-- Chinese text -->
    <text x="0" y="126" text-anchor="middle"
          font-family="'KaiTi', 'STKaiti', SimSun, FangSong, serif" font-size="14"
          fill="url(#redGrad)" letter-spacing="3" opacity="0.85">希望中文特许学校</text>

    <!-- Tagline -->
    <text x="0" y="144" text-anchor="middle"
          font-family="'Raleway', Arial, Helvetica, sans-serif" font-size="8"
          fill="#1B365D" font-weight="400" letter-spacing="3" opacity="0.5">
      EDUCATE · INSPIRE · GROW
    </text>

    <!-- Small decorative diamond -->
    <polygon points="0,-56 3,-53 0,-50 -3,-53" fill="url(#yellowGrad)" opacity="0.5" />
  </g>

  <!-- ========================================== -->
  <!-- SUBTLE OVERALL SHADOW                      -->
  <!-- ========================================== -->
  <path d="
    M 300 72
    C 265 72, 242 78, 200 85
    C 158 92, 110 102, 75 122
    C 45 140, 30 180, 35 215
    C 38 240, 50 255, 70 255
    C 85 255, 98 242, 108 225
    L 138 208
    L 125 525
    C 122 560, 125 590, 135 610
    C 142 622, 155 628, 175 628
    L 425 628
    C 445 628, 458 622, 465 610
    C 475 590, 478 560, 475 525
    L 462 208
    L 492 225
    C 502 242, 515 255, 530 255
    C 550 255, 562 240, 565 215
    C 570 180, 555 140, 525 122
    C 490 102, 442 92, 400 85
    C 358 78, 335 72, 300 72
  " fill="url(#shirtShadow)" pointer-events="none" />

  <!-- ========================================== -->
  <!-- WATERMARK                                   -->
  <!-- ========================================== -->
  <text x="300" y="678" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="7"
        fill="#aaa" letter-spacing="4" opacity="0.35">
    HCCS MERCH · CONCEPT
  </text>
</svg>
